<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Online Cinema</title>
    <link rel="stylesheet" th:href="@{/styles.css}"/>
    <script src="/scripts/phone-mask.js"></script>
</head>

<body>
<div class="home">
    <div class="header">
        <form method="GET" th:action="@{/}">
            <button class="header-button" type="submit" style="left: 70px; background: none; color: #484FE4;">Online Cinema</button>
        </form>
        <form method="GET" th:action="@{/movies}">
            <button class="header-button" type="submit" style="left: 100px; background: linear-gradient(180deg, #3540A3 0%, rgba(74.65, 90.46, 232.69, 0.92) 44%, rgba(50.28, 69.11, 238.53, 0.50) 73%, rgba(21.48, 43.87, 245.44, 0) 100%); overflow: hidden;">Фильмы</button>
        </form>
        <form method="GET" th:action="@{/serials}">
            <button class="header-button" type="submit" style="left: 120px; background: linear-gradient(180deg, #3540A3 0%, rgba(74.65, 90.46, 232.69, 0.92) 44%, rgba(50.28, 69.11, 238.53, 0.50) 73%, rgba(21.48, 43.87, 245.44, 0) 100%); overflow: hidden;">Сериалы</button>
        </form>
        <form method="GET" th:action="@{/search}">
            <button class="header-button" type="submit" style="left: 360px; background: white; box-shadow: 0 4px 4px rgba(0, 0, 0, 0.25) inset; overflow: hidden; border: 1px black solid; gap: 6px; color: black;">🔍Поиск</button>
        </form>
        <form method="GET" th:action="@{/subscription}">
            <button class="header-button" type="submit" style="left: 380px; background: linear-gradient(90deg, rgba(85.50, 39.14, 144.50, 0) 0%, rgba(255, 65.87, 65.87, 0.60) 0%, #7000FF 99%); overflow: hidden;">Подписка</button>
        </form>
        <form method="GET" th:action="@{/login}">
            <button class="header-button" type="submit" style="left: 400px; background: linear-gradient(180deg, #3540A3 0%, rgba(74.65, 90.46, 232.69, 0.92) 44%, rgba(50.28, 69.11, 238.53, 0.50) 73%, rgba(21.48, 43.87, 245.44, 0) 100%); overflow: hidden; gap: 6px;">Войти</button>
        </form>
    </div>

    <div class="reg-form">
    <label class="registration">Регистрация</label>

    <form method="POST" th:action="@{/register}" id="registrationForm">
        <div class="main-info-input">
            <label class="reg-label" for="email">Почта:
                <input id ="email" class="reg-input" type="email" name="email" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$" required/><br/>
            </label>

            <label class="reg-label" for="password">Пароль:
                <input id ="password" class="reg-input" type="password" name="password"/> <br/>
            </label>

            <label class="reg-label" for="lastName">Фaмилия:
                <input id ="lastName" class="reg-input" type="text" name="lastName"/> <br/>
            </label>

            <label class="reg-label" for="firstName">Имя:
                <input id ="firstName" class="reg-input" type="text" name="firstName"/> <br/>
            </label>

            <label class="reg-label" for="phone">Номер телефона:
                <input id ="phone" class="reg-input" type="tel" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required/> <br/>
            </label>

            <label class="reg-label" for="birthDate">Дата рождения:
                <input id ="birthDate" class="reg-input" type="date" name="birthDate"/> <br/>
            </label>

            <label class="reg-label" for="gender">Пол:
                <select id="gender" class="reg-input" name="gender">
                    <option value="male">Мужской</option>
                    <option value="female">Женский</option>
                </select> <br/>
            </label>
        </div>

        <input class="header-button" style="left: 50px; font-size: 28px; font-family: Inter,sans-serif; font-weight: 600; word-wrap: break-word; background: linear-gradient(180deg, #3540A3 0%, rgba(74.65, 90.46, 232.69, 0.92) 44%, rgba(50.28, 69.11, 238.53, 0.50) 73%, rgba(21.48, 43.87, 245.44, 0) 100%); overflow: hidden; gap: 6px;" type="submit" value="Зарегистрироваться"/>
    </form>
    </div>

    <div class="footer">
        <div class="footer-block">
            <label class="footer-label">О нас</label>

            <form method="GET" th:action="@{/company}">
                <button class="footer-button" type="submit">О компании</button>
            </form>
            <form method="GET" th:action="@{/agreement}">
                <button class="footer-button" type="submit">Пользовательское соглашение</button>
            </form>
            <form method="GET" th:action="@{/confidentiality}">
                <button class="footer-button" type="submit">Политика конфиденциальности</button>
            </form>
        </div>

        <div class="footer-block">
            <label class="footer-label">Разделы</label>

            <form method="GET" th:action="@{/account}">
                <button class="footer-button" type="submit">Мой аккаунт</button>
            </form>
            <form method="GET" th:action="@{/movies}">
                <button class="footer-button" type="submit">Фильмы</button>
            </form>
            <form method="GET" th:action="@{/serials}">
                <button class="footer-button" type="submit">Сериалы</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
